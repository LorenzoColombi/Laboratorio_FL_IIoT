[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickstart-pytorch"
version = "1.0.1"
description = "Federated Learning with PyTorch and Flower (Quickstart Example)"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.26.0",
    "flwr-datasets[vision]>=0.5.0",
    "matplotlib>=3.9.0",
    "torch==2.8.0",
    "torchvision==0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"
# [tool.flwr.federations]
# default = "local-simulation"


[tool.flwr.app.components]
serverapp = "pytorchexample.server_app:app"
clientapp = "pytorchexample.client_app:app"

[tool.flwr.app.config]
num-clients = 8 # Number of clients to simulate
num-server-rounds = 3 # Number of rounds of federated learning
fraction-evaluate = 1 # Evaluate all clients every round
local-epochs = 4 # Number of local epochs to train on each client per round
learning-rate = 0.1
batch-size = 32
